<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --apple-gray: #f5f5f7; }
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .section-light { background-color: white; color: #1d1d1f; }
        .apple-link { color: #0066cc; font-weight: 500; }
        .apple-link:hover { text-decoration: underline; }
        /* Эффект плавного появления фото */
        .photo-card { border-radius: 30px; overflow: hidden; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .photo-card:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <!-- Навигация (Прозрачная в стиле Apple) -->
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md py-3 px-10 flex justify-between items-center border-b border-white/10">
        <div class="text-xl font-semibold tracking-tight">Биография</div>
        <div class="hidden md:flex space-x-8 text-sm text-gray-300">
            <a href="#hero" class="hover:text-white transition">О Нас</a>
            <a href="#features" class="hover:text-white transition">Наш Путь</a>
            <a href="#gallery" class="hover:text-white transition">Управльяещый</a>
        </div>
    </nav>

    <!-- Секция 1: Главный экран (Hero) -->
    <section id="hero" class="h-screen flex flex-col justify-center items-center text-center px-4">
        <h1 class="text-5xl md:text-8xl font-bold tracking-tighter mb-6" data-aos="fade-up" data-aos-duration="1500">
            Острый Бригада
        </h1>
        <p class="text-xl md:text-3xl text-gray-400 font-medium mb-10" data-aos="fade-up" data-aos-delay="300" data-aos-duration="1500">
            Банда Острый Бригада
        </p>
        <div class="flex space-x-6" data-aos="fade-up" data-aos-delay="600">
            <a href="#gallery" class="bg-white text-black px-8 py-3 rounded-full font-semibold hover:bg-gray-200 transition">Узнать больше</a>
            <a href="https://t.me/Gapzana" class="apple-link text-xl flex items-center">Связаться <span class="ml-2">→</span></a>
        </div>
    </section>

    <!-- Секция 2: Продукты (Темная галерея) -->
    <section id="features" class="py-24 px-6 bg-zinc-900">
        <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-10">
            <div class="photo-card bg-black h-[500px]" data-aos="fade-right">
                <div class="p-10">
                    <h3 class="text-3xl font-bold mb-4">Начало нашей путей</h3>
                    <p class="text-gray-400">Начинали без ничего.</p>
                </div>
                <!-- Замени на свое фото -->
                <img src="https://69f68448a0be0e562864277a.imgix.net/Gemini_Generated_Image_2xlt6r2xlt6r2xlt.png?auto=format&fit=fill&w=384" class="w-full h-full object-cover opacity-60">
            </div>
            <div class="photo-card bg-black h-[500px] mt-0 md:mt-20" data-aos="fade-left">
                <div class="p-10">
                    <h3 class="text-3xl font-bold mb-4">Наш Будущый Цель</h3>
                    <p class="text-gray-400">Завоеваемь весь Мир.</p>
                </div>
                <img src="https://69f68448a0be0e562864277a.imgix.net/Gemini_Generated_Image_ms4bc0ms4bc0ms4b.png?auto=format&fit=fill&w=384" class="w-full h-full object-cover opacity-60">
            </div>
        </div>
    </section>

    <!-- Секция 3: Светлая секция (Как на сайте Apple) -->
    <section id="gallery" class="section-light py-32 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-4xl md:text-6xl font-bold mb-16" data-aos="fade-up">В Нашей Банда.</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="photo-card h-64 bg-gray-100" data-aos="zoom-in" data-aos-delay="100">
                    <img src="https://69f68448a0be0e562864277a.imgix.net/%D0%9C%D1%83%D0%A5%D0%B0%D0%9C%D0%B52.png?auto=format&fit=fill&w=384" class="w-full h-full object-cover">
                </div>
                <div class="photo-card h-64 bg-gray-100" data-aos="zoom-in" data-aos-delay="200">
                    <img src="https://69f68448a0be0e562864277a.imgix.net/%D0%A8%D1%83%D0%BA%D1%80%D0%B8%D0%BE%D0%BB%D0%BB%D0%BE%D1%85.png?auto=format&fit=fill&w=384" class="w-full h-full object-cover">
                </div>
                <div class="photo-card h-64 bg-gray-100" data-aos="zoom-in" data-aos-delay="300">
                    <img src="https://69f68448a0be0e562864277a.imgix.net/%D0%90%D0%BA%D0%B1%D0%B0%D1%80.png?auto=format&fit=fill&w=384" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer class="py-20 text-center text-gray-500 text-sm">
        <p class="mb-4">Сделано с любовью для Брато.</p>
        <div class="flex justify-center space-x-6">
            <a href="https://t.me/Hisnul_M" class="hover:text-white">МуХаМе2</a>
            <a href="https://t.me/Shukri_Alloh05" class="hover:text-white">شکرالله</a>
            <a href="https://t.me/akbarwx" class="hover:text-white">Akbar</a>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Инициализация анимаций Apple-style
        AOS.init({
            duration: 1200,
            easing: 'ease-in-out-cubic',
            once: false, // Анимация будет повторяться при скролле вверх/вниз
            mirror: true
        });
    </script>
</body>
</html>
